server {
    listen 80;
    server_name local.overdark;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Arquivos estáticos existentes são servidos direto pelo nginx;
    # todo o resto cai no front controller (public/index.php).
    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Nenhum outro .php dentro de public/ deve ser executado.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
