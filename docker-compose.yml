services:
  app:
    build:
      context: ./docker/php
    container_name: overdark_app
    # Roda com o mesmo UID/GID do host para que arquivos gerados no volume
    # (vendor/, composer.lock, caches) não fiquem com dono root.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: overdark_web
    ports:
      - "${WEB_PORT:-8086}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: overdark_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-overdark}
      MYSQL_USER: ${DB_USERNAME:-overdark}
      MYSQL_PASSWORD: ${DB_PASSWORD:-overdark}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Executado só na criação do volume: cria o banco de testes.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
