version: '3.8'

services:
  app:
    build:
      context: ./docker/php
    container_name: overdark_app
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html

  web:
    image: nginx:latest
    container_name: overdark_web
    ports:
      - "${WEB_PORT:-8086}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: overdark_db
    restart: always
    environment:
      MYSQL_DATABASE: overdark
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
